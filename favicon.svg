<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Terminal">
  <!--
    Icono de pestaña: una ventana de terminal con el cursor esperando.
    Todo son formas, ningún texto: así se ve igual en cualquier sistema,
    tenga o no instalada la tipografía monoespaciada de la web.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0d0e"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#2c3336"/>

  <!-- El prompt: dos trazos formando el signo mayor que -->
  <path d="M9 11.5 L14.5 16 L9 20.5"
        fill="none" stroke="#64dbb8" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- El cursor -->
  <rect x="16.8" y="19" width="7.2" height="2.4" rx="1.2" fill="#64dbb8"/>
</svg>
