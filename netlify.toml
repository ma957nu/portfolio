# Sitio estático: no hay nada que compilar, Netlify publica la raíz del repo.
[build]
  publish = "."

# Cabeceras de seguridad. Para un portfolio de ciberseguridad conviene que la
# propia web pase un escáner básico sin pegas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Las secciones tienen URL propia sin almohadilla: /consola en vez de
# /#consola. Se sirven como la misma página (estado 200, no 301), y el
# enrutador de js/app.js se encarga de bajar hasta la sección al cargar.
# Se listan una a una a propósito: con un comodín, cualquier URL inventada
# devolvería la portada en vez de un 404.

[[redirects]]
  from = "/sobre-mi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/experiencia"
  to = "/index.html"
  status = 200

